[workspace]
resolver = "2"
members = ["crates/atd-types", "crates/atd-client", "crates/atd-cli", "crates/atd-mcp-bridge", "crates/atd-ref-server", "examples"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/atd-protocol/atd-mvp"
authors = ["ATD Protocol Contributors"]
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "sync", "time", "process", "fs"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
ulid = { version = "1", features = ["serde"] }
tempfile = "3"
