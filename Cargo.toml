[workspace]
resolver = "2"
members = [
    "crates/atd-protocol",
    "crates/atd-sdk",
    "crates/atd-server",
    "crates/atd-server-http",
    "crates/atd-runtime",
    "crates/atd-tools-echo",
    "crates/atd-tools-fs",
    "crates/atd-tools-shell",
    "crates/atd-tools-web",
    "crates/atd-cli",
    "crates/atd-conformance",
    "crates/atd-mcp-bridge",
    "crates/atd-middleware-fhir",
    "crates/atd-ref-server",
    "crates/atd-mock-weather-server",
    "examples",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/downsea/atd-mvp"
authors = ["ATD Protocol Contributors"]
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "sync", "time", "process", "fs"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
ulid = { version = "1", features = ["serde"] }
tempfile = "3"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "limit"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio", "http1"] }
futures-util = "0.3"
