[package]
name = "atd-ref-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Neutral reference server for the Agent Tool Dispatch (ATD) protocol — ships with real tools, zero dependency on any specific agent framework."

[lib]
name = "atd_ref_server"
path = "src/lib.rs"

[[bin]]
name = "atd-ref-server"
path = "src/main.rs"

[dependencies]
atd-protocol = { path = "../atd-protocol", version = "0.1.0" }
atd-runtime = { path = "../atd-runtime", version = "0.1.0" }
atd-tools-echo = { path = "../atd-tools-echo", version = "0.1.0" }
atd-tools-fs = { path = "../atd-tools-fs", version = "0.1.0" }
atd-tools-shell = { path = "../atd-tools-shell", version = "0.1.0" }
atd-tools-web = { path = "../atd-tools-web", version = "0.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
ulid = { workspace = true }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
atd-runtime = { path = "../atd-runtime", version = "0.1.0", features = ["testing"] }
tempfile = { workspace = true }

[features]
testing = ["atd-runtime/testing"]
