[package]
name = "atd-ref-server"
version = "1.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Reference server binary for the Agent Tool Dispatch (ATD) protocol — wires atd-runtime + atd-tools-* into an installable executable."
readme = "README.md"
keywords = ["atd", "agent", "server", "tool-dispatch", "reference"]
categories = ["command-line-utilities", "api-bindings"]

[lib]
name = "atd_ref_server"
path = "src/lib.rs"

[[bin]]
name = "atd-ref-server"
path = "src/main.rs"

[dependencies]
atd-protocol = { path = "../atd-protocol", version = "1.1.0" }
atd-runtime = { path = "../atd-runtime", version = "1.1.0" }
atd-server = { path = "../atd-server", version = "1.1.0" }
atd-tools-echo = { path = "../atd-tools-echo", version = "1.1.0" }
atd-tools-fs = { path = "../atd-tools-fs", version = "1.1.0" }
atd-tools-shell = { path = "../atd-tools-shell", version = "1.1.0" }
atd-tools-web = { path = "../atd-tools-web", version = "1.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
ulid = { workspace = true }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
atd-runtime = { path = "../atd-runtime", features = ["testing"] }
atd-sdk = { path = "../atd-sdk" }
atd-server = { path = "../atd-server" }
atd-middleware-fhir = { path = "../atd-middleware-fhir" }
atd-middleware-pii-redact-medical = { path = "../atd-middleware-pii-redact-medical" }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }

[features]
testing = ["atd-runtime/testing"]
