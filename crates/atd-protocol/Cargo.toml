[package]
name = "atd-protocol"
version = "1.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Protocol types, wire codec, and sanitization rules for the ATD (Agent Tool Dispatch) reference implementation."
readme = "README.md"
keywords = ["atd", "agent", "tool-dispatch", "protocol", "mcp"]
categories = ["api-bindings", "development-tools"]
exclude = ["tests/fixtures/*"]

[features]
default = []
schema = ["dep:schemars", "dep:jsonschema"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
schemars = { version = "0.8", features = ["preserve_order"], optional = true }
jsonschema = { version = "0.18", default-features = false, features = ["draft202012"], optional = true }

[[bin]]
name = "gen-schema"
required-features = ["schema"]
