[package]
name = "atd-tools-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Built-in web tools for the ATD reference runtime."

[dependencies]
atd-protocol = { path = "../atd-protocol", version = "0.2.0" }
atd-runtime = { path = "../atd-runtime", version = "0.2.0" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli"] }
htmd = "0.5"
url = "2"

[dev-dependencies]
atd-runtime = { path = "../atd-runtime", version = "0.2.0", features = ["testing"] }
