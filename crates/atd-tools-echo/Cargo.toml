[package]
name = "atd-tools-echo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Built-in echo tools for the ATD reference runtime."
readme = "README.md"
keywords = ["atd", "tool", "echo", "agent"]
categories = ["api-bindings", "development-tools"]

[dependencies]
atd-protocol = { path = "../atd-protocol", version = "1.1.0" }
atd-runtime = { path = "../atd-runtime", version = "1.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
atd-runtime = { path = "../atd-runtime", features = ["testing"] }
ulid = { workspace = true }
