[package]
name = "atd-tools-fs"
version = "1.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Built-in fs tools for the ATD reference runtime."
readme = "README.md"
keywords = ["atd", "tool", "filesystem", "agent"]
categories = ["api-bindings", "filesystem"]

[dependencies]
atd-protocol = { path = "../atd-protocol", version = "1.1.0" }
atd-runtime = { path = "../atd-runtime", version = "1.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
ignore = "0.4"
globset = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
regex = "1"
ulid = { workspace = true }

[dev-dependencies]
atd-runtime = { path = "../atd-runtime", features = ["testing"] }
tempfile = { workspace = true }
