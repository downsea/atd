[package]
name = "atd-server-http"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Streamable-HTTP (MCP JSON-RPC) transport for ATD-speaking servers — pair with atd-runtime, sibling of atd-server (Unix-socket transport)."
readme = "README.md"
keywords = ["atd", "mcp", "http", "transport", "agent"]
categories = ["api-bindings", "asynchronous", "network-programming"]

[dependencies]
atd-protocol = { path = "../atd-protocol", version = "1.0.0" }
atd-runtime = { path = "../atd-runtime", version = "1.0.0" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
http = { workspace = true }

[dev-dependencies]
atd-runtime = { path = "../atd-runtime", features = ["testing"] }
atd-server = { path = "../atd-server" }
atd-sdk = { path = "../atd-sdk" }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
futures-util = { workspace = true }
tempfile = { workspace = true }
# SP-capability-v2 Phase F: UCAN-lite JWT construction in shared common.rs.
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
multibase = "0.9"
