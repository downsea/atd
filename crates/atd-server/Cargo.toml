[package]
name = "atd-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Unix-socket listener and connection layer for ATD-speaking servers — pair with atd-runtime to build a server in ~30 lines."
readme = "README.md"
keywords = ["atd", "server", "agent", "tool-dispatch", "unix-socket"]
categories = ["api-bindings", "asynchronous", "network-programming"]

[dependencies]
atd-protocol = { path = "../atd-protocol", version = "0.2.1" }
atd-runtime = { path = "../atd-runtime", version = "0.2.1" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
ulid = { workspace = true }

[dev-dependencies]
atd-runtime = { path = "../atd-runtime", version = "0.2.1", features = ["testing"] }
atd-sdk = { path = "../atd-sdk", version = "0.2.1" }
tempfile = { workspace = true }
