[package]
name = "atd-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Unix-socket listener and connection layer for ATD-speaking servers — pair with atd-runtime to build a server in ~30 lines."
readme = "README.md"
keywords = ["atd", "server", "agent", "tool-dispatch", "unix-socket"]
categories = ["api-bindings", "asynchronous", "network-programming"]

[dependencies]
atd-protocol = { path = "../atd-protocol", version = "1.1.0" }
atd-runtime = { path = "../atd-runtime", version = "1.1.0" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
ulid = { workspace = true }

[dev-dependencies]
atd-runtime = { path = "../atd-runtime", features = ["testing"] }
atd-sdk = { path = "../atd-sdk" }
tempfile = { workspace = true }
# SP-capability-v2 Phase F: integration tests construct UCAN-lite JWTs.
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
multibase = "0.9"
