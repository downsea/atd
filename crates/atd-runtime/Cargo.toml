[package]
name = "atd-runtime"
version = "1.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Server-side runtime for the ATD protocol: Tool trait, Registry, dispatch, Binding, Middleware, capability gate."
readme = "README.md"
keywords = ["atd", "agent", "tool-dispatch", "runtime", "server"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
atd-protocol = { path = "../atd-protocol", version = "1.1.0" }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
ulid = { workspace = true }
regex = "1"

# SP-capability-v2: UCAN-lite JWT compact-form parse + verify.
# Phase B.1: base64. Phase B.2: ed25519-dalek (signature verify) +
# multibase (did:key public-key extraction) + sha2 (UCAN CID hashing
# for revocation-store keying).
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
multibase = "0.9"
sha2 = "0.10"

# SP-pagination-v1: stateless HMAC-signed cursors.
# CBOR over JSON because the cursor is 512-byte-capped on the wire —
# CBOR packs the CursorPayload at ~80B vs JSON's 200B, leaving headroom
# for opaque_state. `hmac` is a thin SHA-256 wrapper over the existing
# sha2 dep.
ciborium = "0.2"
hmac = "0.12"
getrandom = "0.2"
serde_bytes = "0.11"

[dev-dependencies]
tempfile = { workspace = true }

[features]
testing = []
