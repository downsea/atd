# Celia PHR — cross-runtime whitelists single source of truth.
#
# Audit-2026-05-12 §5 (Pattern C): adding a new code system used to mean
# editing four files (Rust + TS array, Rust + TS individual exports).
# Now: edit this file, then the Rust side regenerates automatically via
# `crates/celia-core/build.rs`; the TS side regenerates on
# `pnpm codegen:whitelists` (and `pnpm typecheck` will scream if the
# committed generated file is stale).
#
# Schema:
#   [[code_systems]]      — one entry per CodeSystem URI
#     symbol = "LOINC"        TS export name (UPPER_SNAKE)
#     url    = "http://..."   canonical URI
#   [meta]
#     celia_legacy = "..."    rejected-but-referenced legacy URL

[meta]
celia_legacy = "https://celia.health/fhir/codes"

