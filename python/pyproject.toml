[project]
name = "atd-client"
version = "0.1.0"
description = "Reference Python client SDK for the Agent Tool Dispatch (ATD) protocol."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "ATD Protocol Contributors" }]
keywords = ["atd", "agent", "tool", "llm", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
# `validation` extras enable JSONSchema validation of run_tool `args` against
# definition.input_schema in atd_server.dispatch. Without it, schema is
# silently skipped (a single debug log on import). Hard dep planned once
# Python adopters consistently want validation; cbrain doesn't today.
validation = [
    "jsonschema>=4",
]

[project.urls]
Homepage = "https://github.com/downsea/atd-mvp"
Repository = "https://github.com/downsea/atd-mvp"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atd_client", "src/atd_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]  # let the formatter handle line length

[tool.ruff.lint.per-file-ignores]
# errors.py mirrors Rust AtdError enum variant names exactly; N818 (Error suffix) intentionally skipped
"src/atd_client/errors.py" = ["N818"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
packages = ["atd_client", "atd_server"]
mypy_path = "src"
