[package]
name = "atd-examples"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[[example]]
name = "hello_atd"
path = "hello_atd.rs"

[[example]]
name = "hello_langchain"
path = "hello_langchain.rs"
required-features = ["langchain"]

[features]
default = []
langchain = ["atd-sdk/langchain"]

[dependencies]
atd-sdk = { path = "../crates/atd-sdk" }
atd-protocol = { path = "../crates/atd-protocol" }
tokio = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
