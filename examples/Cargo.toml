[package]
name = "atd-examples"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[example]]
name = "hello_atd"
path = "hello_atd.rs"

[[example]]
name = "hello_langchain"
path = "hello_langchain.rs"
required-features = ["langchain"]

[features]
default = []
langchain = ["atd-client/langchain"]

[dependencies]
atd-client = { path = "../crates/atd-client" }
atd-types = { path = "../crates/atd-types" }
tokio = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
